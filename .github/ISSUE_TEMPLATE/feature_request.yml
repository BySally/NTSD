name: "Suggestion / Предложить улучшение"
description: "Suggest an idea for Nuclear Tech: Second Dawn / Предложить идею для NTSD"
title: "[Suggestion] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are welcome. There is no guarantee that every idea can be implemented.
        Предложения приветствуются, но реализация каждой идеи не гарантируется.
  - type: input
    id: category
    attributes:
      label: "Topic / Тема"
      placeholder: "Gameplay, automation, interface, performance, other / Геймплей, автоматизация, интерфейс, оптимизация"
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: "Idea / Идея"
      description: "What would you like to change? / Что предлагаешь изменить?"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Why is it useful? / Для чего это нужно?"
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: "Examples or screenshots / Примеры или скриншоты"
    validations:
      required: false
